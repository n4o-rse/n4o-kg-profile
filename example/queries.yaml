prefixes: 'PREFIX ogham: <http://ontology.ogham.link/>

  PREFIX crm: <http://www.cidoc-crm.org/cidoc-crm/>

  PREFIX rdfs: <http://www.w3.org/2000/01/rdf-schema#>

  '
queries:
- id: classes-with-counts
  title: Classes used, with counts
  intro: What occurs in this collection — the counterpart to the VoID statistics.
  sparql: "SELECT ?class (COUNT(?s) AS ?count) WHERE {\n  ?s a ?class\n} GROUP BY ?class ORDER BY DESC(?count)\n"
- id: stones-via-crm
  title: Ogham stones via their CRM superclass
  intro: 'Checks that the CIDOC CRM alignment works: the query asks for E22 and is answered from ogham:OghamStone.'
  sparql: "SELECT ?stone ?label WHERE {\n  ?stone a/rdfs:subClassOf* crm:E22_Human-Made_Object ;\n   \
    \      rdfs:label ?label\n} ORDER BY ?label\n"
